# SonarQube Configuration for NVMesh Infrastructure
sonar.projectKey=NBUSW_NVMesh_NVMesh_infrastructure
sonar.qualitygate.wait=true
sonar.host.url=https://sonar.nvidia.com/

sonar.sources=.

# =============================================================================
# TEST INCLUSIONS - Files that contain test code
# =============================================================================
sonar.test.inclusions=\
  **/test/**,\
  **/test_*.py,\
  **/*_test.py,\
  xlro/qa/**,\
  xlro/block/**

# =============================================================================
# COVERAGE EXCLUSIONS - Files excluded from coverage analysis
# =============================================================================
sonar.coverage.exclusions=\
  **/test/**,\
  **/test_*.py,\
  **/*_test.py,\
  xlro/qa/**,\
  xlro/block/**,\
  xlro/infra/**,\
  xlro/ansible/**,\
  xlro/docker/**,\
  xlro/docs/**,\
  xlro/ides/**,\
  xlro/jupyter/**,\
  xlro/jupyter_examples/**,\
  xlro/slack/**

# =============================================================================
# EXCLUSIONS - Internal/Infrastructure code not shipped to customers
# =============================================================================
sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  **/*.pyo,\
  **/*.so,\
  **/*.tgz,\
  xlro/infra/**,\
  xlro/qa/**,\
  xlro/block/**,\
  xlro/ansible/**,\
  xlro/docker/**,\
  xlro/docs/**,\
  xlro/ides/**,\
  xlro/jupyter/**,\
  xlro/jupyter_examples/**,\
  xlro/slack/**,\
  Dockerfile.Jenkins,\
  ci_settings.yaml,\
  ci-trigger-patterns,\
  **/*.json
