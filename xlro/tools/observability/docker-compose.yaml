services:
  prometheus:
    image: prom/prometheus
    container_name: observability-prometheus
    ports:
      - 9090:9090
    volumes:
      - prometheus-storage:/prometheus
      - /var/lib/jenkins/observability-cluster/prometheus.yml:/etc/prometheus/prometheus.yml
  grafana:
    image: grafana/grafana-enterprise
    container_name: observability-grafana
    ports:
      - 3000:3000
    volumes:
      - grafana-storage:/var/lib/grafana
  opensearch:
    image: opensearchproject/opensearch
    container_name: observability-opensearch
    ports:
      - 9200:9200
      - 9600:9600
    environment:
      - discovery.type=single-node
    volumes:
      - opensearch-storage:/usr/share/opensearch/data
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards
    container_name: observability-opensearch-dashboards
    ports:
      - 5601:5601
    expose:
      - "5601"
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
  neo4j:
    image: neo4j:latest
    container_name: observability-neo4j
    ports:
      - 7474:7474
      - 7687:7687
    volumes:
      - neo4j-storage:/data


volumes:
  grafana-storage:
    external: true
  prometheus-storage:
    external: true
  opensearch-storage:
    external: true
  neo4j-storage:
    external: true
